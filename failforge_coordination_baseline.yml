name: coordination-baseline
seed: 42
time:
  duration_ms: 20000
  tick_ms: 10
  warmup_ms: 8000
system:
  type: process_cluster
  nodes:
    count: 3
    command: "COORD_PORT={port} COORD_NODE_ID={node_id} COORD_DB_PATH=.failforge/data/{run_id}/{node_id}.db COORD_PEER_URLS={proxy_url}/node-1,{proxy_url}/node-2,{proxy_url}/node-3 COORD_ADVERTISE_URL={proxy_url}/{node_id} COORD_REPLICATION_TOKEN=failforge-local-baseline COORD_REQUIRE_WRITE_QUORUM=true COORD_CLUSTER_ROLE=follower COORD_ELECTION_TIMEOUT=1.5 COORD_HEARTBEAT_INTERVAL=0.3 FAILFORGE_DIAGNOSTIC_DUMP_AFTER=15 python3 scripts/coordination_node.py"
    ports:
      start: 25000
    data_dir: ".failforge/data/{run_id}/{node_id}"
network:
  mode: controlled_proxy
  proxy_port: 25090
workload:
  type: coordination-service
  clients: 3
  minimum_successful_operations: 50
  minimum_successful_by_operation:
    put: 5
    get: 5
    lock: 5
    unlock: 5
  keys: [lock-a, lock-b, data-x]
  operations:
    put: {weight: 2}
    get: {weight: 2}
    lock: {weight: 3}
    unlock: {weight: 3}
faults:
  mode: none
checkers:
  - name: lock_exclusivity
  - name: no_two_leaders
output:
  dir: "runs/coordination-baseline-{seed}-{run_id}"
